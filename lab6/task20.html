<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание №20 | Профессиональный Аркадный Кликер</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --target-color: #ffc107;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            padding: 24px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .game-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .counter-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .game-viewport {
            width: 100%;
            height: 320px;
            background-color: #020617;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--border-color);
            margin-bottom: 16px;
        }

        /* Динамический игровой объект */
        #targetObj {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
            /* Плавное перемещение без остановки */
            transition: left 0.2s ease-out, top 0.2s ease-out, width 0.2s, height 0.2s;
        }

        #targetObj:active {
            transform: scale(0.9);
        }

        .difficulty-select {
            background-color: #020617;
            color: white;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 16px;
            width: 100%;
            outline: none;
            cursor: pointer;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            background-color: var(--primary);
            color: white;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .victory-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(2, 6, 23, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 1.6rem;
            color: #10b981;
            font-weight: bold;
            z-index: 5;
        }

        .game-instructions {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <main class="game-card">
        <div class="game-box-header">
            <span class="counter-label">Счет: <span id="currentScore">0</span> / 10</span>
            <span id="gameStatus" style="color: #a1a1aa; font-weight: 600;">В игре</span>
        </div>

        <!-- Выбор уровня сложности перед стартом -->
        <select id="diffSelect" class="difficulty-select">
            <option value="easy">Легкий (Крупный объект / Медленный бег)</option>
            <option value="medium" selected>Средний (Обычный объект / Постоянный бег)</option>
            <option value="hard">Сложный (Маленький объект / Быстрый бег)</option>
        </select>

        <div class="game-viewport" id="viewport">
            <div id="targetObj" role="button" aria-label="Поймай меня"></div>
            
            <div class="victory-screen" id="victoryScreen">
                <span>Победа! 🎉</span>
                <button class="btn" id="restartBtn" style="margin-top: 16px; max-width: 200px;">Играть заново</button>
            </div>
        </div>

        <footer class="game-instructions">
            Правила: Успейте кликнуть по объекту. Объект **не останавливается** и меняет позицию по таймеру автоматически!
        </footer>
    </main>

    <script>
        'use strict';
        (() => {
            const viewport = document.querySelector('#viewport');
            const targetObj = document.querySelector('#targetObj');
            const currentScoreEl = document.querySelector('#currentScore');
            const gameStatus = document.querySelector('#gameStatus');
            const victoryScreen = document.querySelector('#victoryScreen');
            const restartBtn = document.querySelector('#restartBtn');
            const diffSelect = document.querySelector('#diffSelect');

            let userScore = 0;
            const winConditionScore = 10;
            let moveInterval = null; // Переменная бесконечного таймера движения

            // Конфигурация сложности (Размер объекта в px и скорость смены позиций в мс)
            const config = {
                easy: { size: 50, speed: 1200 },
                medium: { size: 36, speed: 800 },
                hard: { size: 24, speed: 500 }
            };

            // Функция перемещения объекта в случайную координату (без вылета за края)
            const relocateTarget = () => {
                const viewportRect = viewport.getBoundingClientRect();
                const targetRect = targetObj.getBoundingClientRect();

                const limitX = viewportRect.width - targetRect.width;
                const limitY = viewportRect.height - targetRect.height;

                const coordX = Math.floor(Math.random() * limitX);
                const coordY = Math.floor(Math.random() * limitY);

                targetObj.style.transform = 'none'; // Сброс начального CSS-центрирования
                targetObj.style.left = `${coordX}px`;
                targetObj.style.top = `${coordY}px`;
            };

            // Запуск непрерывного движения объекта
            const startContinuousMovement = () => {
                // Очищаем старый интервал, если он был
                if (moveInterval) clearInterval(moveInterval);

                const currentDiff = diffSelect.value;
                const activeConfig = config[currentDiff];

                // Динамически применяем размеры объекта
                targetObj.style.width = `${activeConfig.size}px`;
                targetObj.style.height = `${activeConfig.size}px`;

                // Запускаем бесконечный цикл смены позиций
                moveInterval = setInterval(relocateTarget, activeConfig.speed);
            };

            // Инициализация при первом запуске / смене сложности
            const initGame = () => {
                userScore = 0;
                currentScoreEl.textContent = userScore;
                gameStatus.textContent = 'В игре';
                gameStatus.style.color = '#a1a1aa';
                victoryScreen.style.display = 'none';
                targetObj.style.display = 'block';
                diffSelect.disabled = false;

                // Ставим в центр перед началом
                targetObj.style.left = '50%';
                targetObj.style.top = '50%';
                targetObj.style.transform = 'translate(-50%, -50%)';

                startContinuousMovement();
            };

            // Обработка успешного клика по объекту
            targetObj.addEventListener('click', () => {
                if (userScore >= winConditionScore) return;

                userScore++;
                currentScoreEl.textContent = userScore;

                if (userScore === winConditionScore) {
                    // Конец игры и победа
                    clearInterval(moveInterval);
                    gameStatus.textContent = 'Завершена';
                    gameStatus.style.color = '#10b981';
                    targetObj.style.display = 'none';
                    victoryScreen.style.display = 'flex';
                    diffSelect.disabled = true; // Блокируем смену сложности при экране победы
                } else {
                    // При успешном клике мгновенно меняем позицию и перезапускаем таймер
                    relocateTarget();
                    startContinuousMovement();
                }
            });

            // Слушатели кнопок и переключателей
            diffSelect.addEventListener('change', initGame);
            restartBtn.addEventListener('click', initGame);

            // Мягкий автоматический старт при загрузке страницы
            startContinuousMovement();
        })();
    </script>
</body>
</html>
